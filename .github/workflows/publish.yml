name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # The bump script pushes its own chore commit, so that push must not trigger a second run.
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: bump to')"

    # id-token lets the job ask GitHub to sign a statement about this run, which is what JSR verifies.
    # Naming any permission narrows the whole set, so contents has to be stated for checkout.
    # contents is write rather than read because the release step creates a tag and a release.
    permissions:
      contents: write
      id-token: write

    steps:
      # Full history so the release step can describe the previous version tag and log a commit range.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Every merge publishes as the next patch unless deno.json already carries a manual bump.
      - name: Bump version
        run: bash .github/workflows/scripts/bump-version.sh

      # A published version can never be replaced, so every check runs before publish is reached.
      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task check
      - run: deno task test

      - run: deno publish

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/scripts/create-release.sh
