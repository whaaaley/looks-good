name: Publish

# Manual escape hatch: publishes whatever version deno.json carries, with no tag or release.
# The Release workflow is the normal path and owns tags, releases, and version bumps.
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # id-token lets the job ask GitHub to sign a statement about this run, which is what JSR verifies.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # A published version can never be replaced, so every check runs before publish is reached.
      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task check
      - run: deno task test

      - run: deno publish
