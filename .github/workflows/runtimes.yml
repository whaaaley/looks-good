name: Runtimes

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # A runtime release can break this without any commit here, so it also runs weekly.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: runtimes-${{ github.ref }}
  cancel-in-progress: true

# The suites import these through Deno's import map, which Node and Bun cannot read.
# jsr add resolves the JSR names against npm.jsr.io and writes the .npmrc that points there,
# but it rejects unscoped names, so the plain npm packages install in a second command.
# Both jobs install the same set, so it is written once here rather than in each job.
env:
  JSR_DEPENDENCIES: '@std/assert @std/path'
  NPM_DEPENDENCIES: >-
    @typescript-eslint/parser@^8.67.0
    eslint@^10.8.1
    mdast-util-from-markdown@^2.0.3
    minimatch@^10.2.6
    nlcst-to-string@^4.0.0
    parse-english@^7.0.0
    @eslint/js@^10.0.1
    eslint-plugin-import-x@^4.17.1
    globals@^17.11.0
    typescript-eslint@^8.67.0
    @types/node@^26.2.0

jobs:
  node:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - '24.19.0'
          - '26.7.0'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.version }}

      # jsr add writes a package.json, which switches Deno to node-modules resolution.
      # Nothing in this workflow runs deno, and the deno checks live in publish.yml,
      # so the file only ever exists on a disposable runner.
      - run: npx jsr add ${{ env.JSR_DEPENDENCIES }}
      - run: npm install --no-audit --no-fund ${{ env.NPM_DEPENDENCIES }}

      # src/index.test.ts walks the docs with Deno.readDir and is deliberately Deno only,
      # so the globs name the two directories the other runtimes can prove rather than all of src.
      - run: node --test 'src/utils/**/*.test.ts' 'src/rules/**/*.test.ts'

  bun:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # bunx runs jsr through Bun's own installer, so this job needs no Node at all.
      - run: bunx --bun jsr add ${{ env.JSR_DEPENDENCIES }}
      - run: bun add ${{ env.NPM_DEPENDENCIES }}

      # bun test takes directories rather than globs, so the same exclusion is expressed as paths.
      - run: bun test src/utils/ src/rules/
